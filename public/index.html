<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LikeAI Portal OS</title>
    <style>
      :root {
        --bg: #f3f8f1;
        --card: #ffffff;
        --primary: #2e7d32;
        --secondary: #1565c0;
        --muted: #5f6c5c;
        --border: #dfeae0;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, sans-serif;
        background: var(--bg);
        color: #1f2a1f;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 24px;
      }
      .card {
        width: min(100%, 460px);
        background: var(--card);
        border-radius: 18px;
        box-shadow: 0 12px 40px rgba(0,0,0,0.08);
        padding: 24px;
        border: 1px solid var(--border);
      }
      h2 { margin: 0 0 12px; }
      p { margin: 0 0 16px; color: var(--muted); }
      label {
        display: block;
        font-size: 0.9rem;
        margin-bottom: 6px;
        color: var(--muted);
      }
      input, button {
        width: 100%;
        border-radius: 10px;
        padding: 12px 14px;
        font-size: 1rem;
        margin-bottom: 12px;
      }
      input {
        border: 1px solid var(--border);
        background: #fafdfb;
      }
      button {
        border: none;
        font-weight: 600;
        cursor: pointer;
      }
      .primary { background: var(--primary); color: white; }
      .secondary { background: var(--secondary); color: white; }
      #status, #result {
        margin-top: 12px;
        padding: 12px;
        border-radius: 10px;
        font-size: 0.94rem;
      }
      #status {
        background: #eef7ee;
        color: #234b27;
        display: none;
      }
      #result {
        background: #f5faf5;
        border: 1px solid var(--border);
        min-height: 120px;
      }
      .hidden { display: none; }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>🥬 LikeAI Cristal Portal</h2>
      <p>ระบบพร้อมใช้งานสำหรับรับข้อมูลและส่งต่อไปยัง backend ภายนอก</p>

      <label for="name">ชื่อผู้ใช้ *</label>
      <input id="name" placeholder="กรอกชื่อผู้ใช้" />

      <label for="from">โค้ดต้นทาง</label>
      <input id="from" placeholder="เช่น Cristal-ROOT" />

      <label for="group">กลุ่ม / หมู่บ้าน *</label>
      <input id="group" placeholder="กรอกกลุ่ม" />

      <button class="primary" id="submitBtn">สร้าง Portal</button>
      <div id="status"></div>
      <div id="result"></div>
    </div>

    <script>
      const submitBtn = document.getElementById('submitBtn');
      const statusBox = document.getElementById('status');
      const resultBox = document.getElementById('result');

      function showStatus(message, isError = false) {
        statusBox.textContent = message;
        statusBox.style.display = 'block';
        statusBox.style.background = isError ? '#fff1f1' : '#eef7ee';
        statusBox.style.color = isError ? '#8d1d1d' : '#234b27';
      }

      async function submitPortal() {
        const payload = {
          name: document.getElementById('name').value.trim(),
          from: document.getElementById('from').value.trim(),
          group: document.getElementById('group').value.trim(),
        };

        if (!payload.name || !payload.group) {
          showStatus('❌ ต้องกรอกชื่อและกลุ่มก่อน', true);
          return;
        }

        showStatus('⏳ กำลังสร้าง Portal...');

        try {
          const res = await fetch('/api/portal', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload),
          });
          const data = await res.json();

          if (!res.ok || data.status !== 'success') {
            showStatus(data.message || '❌ ส่งข้อมูลล้มเหลว', true);
            return;
          }

          const record = data.record;
          resultBox.innerHTML = `
            <strong>✅ Portal Created</strong><br>
            ID: <b>${record.id}</b><br>
            ชื่อ: ${record.name}<br>
            กลุ่ม: ${record.group}<br>
            จาก: ${record.from}<br>
            เวลา: ${record.time}<br>
            <button class="secondary" onclick="navigator.clipboard.writeText('${record.id}')">Copy Code</button>
          `;
          showStatus('✅ สร้าง Portal สำเร็จและพร้อมส่งต่อระบบภายนอก');
        } catch (error) {
          console.error(error);
          showStatus('❌ เกิดข้อผิดพลาดในการเชื่อมต่อ backend', true);
        }
      }

      submitBtn.addEventListener('click', submitPortal);
    </script>
  </body>
</html>
